[ABOUT]
NAME=SetupLab
AUTHOR=Vincent Chevalier / LHK Informatique
VERSION=1.0.0-beta.1.5
DESCRIPTION=Beta 1.5. Qualifying and race setups computed and explained for every car and track, calibrated on your own laps. Nothing is saved without your click: try each proposed setup in the pits, keep or refuse each effect, then validate. English or French (header badge).

