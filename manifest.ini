[ABOUT]
NAME=SetupLab
AUTHOR=Vincent Chevalier / LHK Informatique
VERSION=1.0.0-beta.1.5.7
DESCRIPTION=Beta 1.5.7. Qualifying and race setups computed and explained for every car and track, calibrated on your own laps. Nothing is saved without your click: try each proposed setup in the pits, keep or refuse each setting, then validate. English or French (header badge).

[CORE]
LAZY=NONE

[WINDOW_0]
ID=setup
NAME=SetupLab
FUNCTION_MAIN=SETUPLAB__MAIN
ICON=icon.png
FLAGS=MAIN,SETUP,NO_TITLE_BAR,NO_BACKGROUND,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE
PADDING=0,0
SIZE=780,760
MIN_SIZE=420,360

[WINDOW_1]
ID=debug
NAME=SetupLab Debug
FUNCTION_MAIN=SETUPLAB__DEBUG
ICON=icon.png
FLAGS=SETUP
SIZE=760,560
MIN_SIZE=420,300

[WINDOW_2]
ID=overlay
NAME=SetupLab Overlay
FUNCTION_MAIN=SETUPLAB__OVERLAY
ICON=icon.png
FLAGS=MAIN,NO_TITLE_BAR,NO_BACKGROUND,FADING
PADDING=0,0
SIZE=420,230
MIN_SIZE=280,30

[WINDOW_3]
ID=track
NAME=SetupLab Track
FUNCTION_MAIN=SETUPLAB__TRACK
ICON=icon.png
FLAGS=NO_TITLE_BAR,NO_BACKGROUND,NO_SCROLLBAR,NO_SCROLL_WITH_MOUSE
